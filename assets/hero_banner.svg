<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09172A"/>
      <stop offset="50%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>

    <!-- Tricolor Wave Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Grid Patterns -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" />
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" />
  </g>

  <!-- Tricolor Wave Art -->
  <path d="M 0 60 Q 300 0, 600 80 T 1200 20 L 1200 0 L 0 0 Z" fill="url(#saffronGrad)"/>
  <path d="M 0 380 Q 400 320, 800 390 T 1200 340 L 1200 400 L 0 400 Z" fill="url(#greenGrad)"/>

  <!-- Glowing Chakra Emblem Left -->
  <g transform="translate(140, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#FF7700" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <!-- 24 Spokes -->
    <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="-42" y1="-42" x2="42" y2="42"/>
      <line x1="-42" y1="42" x2="42" y2="-42"/>
      <line x1="-55" y1="-23" x2="55" y2="23"/>
      <line x1="-55" y1="23" x2="55" y2="-23"/>
      <line x1="-23" y1="-55" x2="23" y2="55"/>
      <line x1="-23" y1="55" x2="23" y2="-55"/>
    </g>
  </g>

  <!-- Glowing Chakra Emblem Right -->
  <g transform="translate(1060, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#138808" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="-42" y1="-42" x2="42" y2="42"/>
      <line x1="-42" y1="42" x2="42" y2="-42"/>
    </g>
  </g>

  <!-- Central Event Typography -->
  <text x="600" y="110" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" letter-spacing="4">DR. VIRENDRA SWARUP INSTITUTE OF COMPUTER STUDIES</text>
  
  <text x="600" y="190" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="58" font-weight="900" letter-spacing="2">CODE FOR THE NATION</text>

  <text x="600" y="240" text-anchor="middle" fill="#FF9933" font-family="'Cinzel', serif" font-size="24" font-weight="800" letter-spacing="3">THEMATIC WEBSITE DEVELOPMENT COMPETITION 2026</text>

  <!-- Badges / Tags -->
  <g transform="translate(600, 310)">
    <rect x="-380" y="-22" width="760" height="44" rx="22" fill="#0C1E38" stroke="#FF7700" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" letter-spacing="2">
      INNOVATE · BUILD · DESIGN · DEPLOY · INSPIRE
    </text>
  </g>
</svg>
